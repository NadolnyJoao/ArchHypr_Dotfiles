# O wrapper chama hyprlock; explicite a espera pelo protocolo de bloqueio.
# https://wiki.hypr.land/hypr-ecosystem/user/hypridle/
general {
    lock_cmd = bash "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/lock.sh"
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}

listener {
    timeout = 300
    on-timeout = bash "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/idle-brightness.sh" dim
    on-resume = bash "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/idle-brightness.sh" restore
}

listener {
    timeout = 600
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}
