# Janelas.
bindsym $mod+q kill
bindsym $mod+w floating toggle
bindsym $mod+f fullscreen toggle
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down

# Aplicativos e ferramentas da sessão.
bindsym $mod+e exec thunar
bindsym $mod+Return exec kitty --config $root/kitty/kitty.conf
bindsym $mod+space exec rofi -config $root/rofi/config.rasi -show drun
bindsym $mod+Shift+Return exec bash $root/scripts/action.sh browser
bindsym $mod+Shift+space exec python3 $root/scripts/theme.py menu
bindsym $mod+l exec swaylock -f -c 000000
bindsym $mod+Shift+s exec bash $root/scripts/action.sh screenshot
bindsym $mod+v exec bash $root/scripts/action.sh clipboard
bindsym $mod+Shift+w exec python3 $root/scripts/wallpaper.py menu
bindsym $mod+period exec python3 $root/scripts/wallpaper.py next
bindsym $mod+comma exec python3 $root/scripts/wallpaper.py prev

# Teclas de mídia. O SwayOSD exibe o indicador na tela.
bindsym --locked XF86AudioRaiseVolume exec swayosd-client --output-volume raise --max-volume 100 || wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec swayosd-client --output-volume lower || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86MonBrightnessUp exec swayosd-client --brightness +5 || brightnessctl -c backlight set 5%+
bindsym --locked XF86MonBrightnessDown exec swayosd-client --brightness -5 || brightnessctl -c backlight set 5%-

# Recarregar as configurações, para manutenção.
bindsym $mod+Shift+r reload

# Números físicos, para funcionar também com Shift no layout internacional.
bindsym --to-code $mod+1 workspace number 1
bindsym --to-code $mod+Shift+1 move container to workspace number 1
bindsym --to-code $mod+2 workspace number 2
bindsym --to-code $mod+Shift+2 move container to workspace number 2
bindsym --to-code $mod+3 workspace number 3
bindsym --to-code $mod+Shift+3 move container to workspace number 3
bindsym --to-code $mod+4 workspace number 4
bindsym --to-code $mod+Shift+4 move container to workspace number 4
bindsym --to-code $mod+5 workspace number 5
bindsym --to-code $mod+Shift+5 move container to workspace number 5
bindsym --to-code $mod+6 workspace number 6
bindsym --to-code $mod+Shift+6 move container to workspace number 6
bindsym --to-code $mod+7 workspace number 7
bindsym --to-code $mod+Shift+7 move container to workspace number 7
bindsym --to-code $mod+8 workspace number 8
bindsym --to-code $mod+Shift+8 move container to workspace number 8
bindsym --to-code $mod+9 workspace number 9
bindsym --to-code $mod+Shift+9 move container to workspace number 9
