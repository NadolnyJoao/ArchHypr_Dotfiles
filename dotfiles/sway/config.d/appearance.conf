font pango:JetBrainsMono Nerd Font 11
default_border pixel 2
default_floating_border pixel 2
gaps inner 6
gaps outer 12
workspace_auto_back_and_forth no
focus_follows_mouse yes
# Super + botão esquerdo move. Super + botão direito redimensiona.
floating_modifier $mod normal

# Mesmo tamanho e posição inicial dos gerenciadores no Hyprland.
for_window [app_id="^(kitty|nm-connection-editor|blueman-manager|pavucontrol|org\.pulseaudio\.pavucontrol)$"] floating enable, resize set width 70 ppt height 65 ppt, move position center
for_window [class="(?i)^(kitty|nm-connection-editor|blueman-manager|pavucontrol|org\.pulseaudio\.pavucontrol)$"] floating enable, resize set width 70 ppt height 65 ppt, move position center
