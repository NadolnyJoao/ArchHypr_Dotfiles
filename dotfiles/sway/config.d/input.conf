# Americano internacional com teclas mortas, como configurado nas suas máquinas.
input type:keyboard {
    xkb_layout us
    xkb_variant intl
}
input type:touchpad {
    tap enabled
    dwt enabled
}

# O gesto avança pelo número do workspace, incluindo os vazios.
bindgesture swipe:3:left exec python3 $root/scripts/desktop.py workspace next
bindgesture swipe:3:right exec python3 $root/scripts/desktop.py workspace prev
