# Tipografia e espaço entre o texto e as bordas da janela.
font_family JetBrainsMono Nerd Font
font_size 12
window_padding_width 12 14
# O texto permanece sólido. Apenas o fundo do terminal fica translúcido.
background_opacity 0.84

# Abas arredondadas no topo, visíveis desde a primeira aba.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 1
tab_bar_margin_width 10
tab_bar_margin_height 8 4
tab_title_template "{index}  {title}"

# Cores escritas pelo seletor de temas do rice.
include colors.conf
